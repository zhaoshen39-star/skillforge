[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge"
version = "0.5.0"
description = "Turn any repo, doc, or PDF into an auditable agent skill — generate, lint, fix, and detect drift. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "薛兆珅" }]
keywords = ["agent-skills", "skill", "llm", "cli", "lint", "audit", "deterministic", "security", "prompt-injection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Documentation",
]

[project.optional-dependencies]
pdf = ["pypdf>=3"]

[project.scripts]
skillforge = "skillforge:main"

[tool.setuptools]
py-modules = ["skillforge"]
