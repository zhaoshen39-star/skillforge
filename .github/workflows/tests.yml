name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Self-check (offline fixture)
        run: python skillforge.py selftest

      - name: Test suite
        run: python tests/verify_skillforge.py

      - name: Smoke build from this repo
        run: python skillforge.py build . -o out/self-skill --force

      - name: Dry run (must not write)
        run: python skillforge.py build . -o out/preview --dry-run

      - name: Lint generated package
        run: python skillforge.py lint out/self-skill

      - name: Auto-fix is a no-op on a healthy package
        run: python skillforge.py fix out/self-skill

      - name: Generated package is in sync with source
        run: python skillforge.py diff out/self-skill

      - name: Score gate (CI threshold)
        run: python skillforge.py score out/self-skill --min 90

      - name: Install + lint --all round-trip
        run: |
          python -c "import subprocess,sys,tempfile,pathlib; d=tempfile.mkdtemp(); run=lambda a: subprocess.run([sys.executable,'skillforge.py']+a).returncode; ok = run(['install','out/self-skill','--dir',d])==0 and (pathlib.Path(d)/'skillforge'/'SKILL.md').exists() and run(['install','--list','--dir',d,'--json'])==0 and run(['lint','--all','--roots',d,'--min','90'])==0 and run(['install','out/self-skill','--dir',d,'--uninstall'])==0; print('install round-trip:', 'ok' if ok else 'FAILED'); sys.exit(0 if ok else 1)"
